<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Top Controls (Theme Toggle & Custom Name) -->
    <div class="top-controls">
      <button id="theme-toggle" class="control-btn" title="Toggle Light/Dark Mode">🌙 Dark Mode</button>
      <button id="edit-name-btn" class="control-btn" title="Set Custom Name">✏️ Set Name</button>
    </div>

    <!-- Header Card: Time, Date, Greeting -->
    <header class="card header-card">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Loading date...</div>
      <h1 id="greeting" class="greeting">Good Morning</h1>
    </header>

    <!-- Main Grid -->
    <main class="main-grid">
      <!-- Left Column: Focus Timer & Quick Links -->
      <div class="left-column">
        <!-- Focus Timer Card -->
        <section class="card timer-card">
          <h2 class="card-title">Focus Timer</h2>
          <div id="timer-display" class="timer-display">25:00</div>
          <div class="timer-buttons">
            <button id="start-btn" class="btn btn-primary">Start</button>
            <button id="stop-btn" class="btn btn-secondary">Stop</button>
            <button id="reset-btn" class="btn btn-secondary">Reset</button>
          </div>
        </section>

        <!-- Quick Links Card -->
        <section class="card links-card">
          <h2 class="card-title">Quick Links</h2>
          <form id="link-form" class="input-group">
            <input type="text" id="link-name" placeholder="Name" required>
            <input type="url" id="link-url" placeholder="https://..." required>
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <div id="links-container" class="links-grid"></div>
        </section>
      </div>

      <!-- Right Column: Tasks -->
      <section class="card tasks-card">
        <h2 class="card-title">Tasks</h2>
        <form id="task-form" class="input-group">
          <input type="text" id="task-input" placeholder="Add a new task..." required>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="task-error" class="error-msg"></p>
        <ul id="task-list" class="task-list"></ul>
      </section>
    </main>
  </div>

  <script src="node.js"></script>
</body>
</html>
